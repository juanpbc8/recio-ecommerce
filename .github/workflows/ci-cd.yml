name: Recio-Ecommerce Fullstack CI

on:
  push:
    branches: ['main', 'develop'] # Corre cuando se hace merge a main o push directo a develop
  pull_request:
    branches: ['main', 'develop'] # Corre cada vez que abren un PR hacia main o hacia develop

jobs:
  quality-gate:
    name: Integración Continua (CI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web-store

    steps:
      - name: 1. Clonar el repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web-store/package-lock.json

      - name: 3. Instalar dependencias del proyecto
        run: npm ci

      - name: 4. Validar Esquema y Generar Cliente de Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 5. Compilar Aplicación (Build de Validación)
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
