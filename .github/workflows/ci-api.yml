name: API Docker CI

on:
  push:
    branches: ['main', 'develop']
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'
      - 'package*.json'
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'
      - 'package*.json'

jobs:
  build-api-docker:
    name: Validar build del API en Docker
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker del API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: recio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar que la imagen se construyo
        run: docker image ls recio-api:latest
